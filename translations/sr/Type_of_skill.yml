ARSP: Коришћење основних аритметичких формула у табели
COPA: Коришћење алатки за копирање и љепљење за дуплирање или премештање информација у документу
CMFL: Копирање или премjештање датотеке или фасцикле
DLDONLD: Читање или преузимање онлајн новина, часописа или електронских књига
EMAIL: Слање е - поште са приложеним датотекама
EPRS: Креирање електронских презентација са софтвером за презентације
FONLCRS: Извођење формалног онлајн курса
GSINF: Добијање информација о роби или услугама на мрежи
GSPUR: Куповина или наручивање робе или услуга путем Интернета
HLTHINF: Тражење здравствених информација (о повредама, болести, исхрани, итд.)
INST: Повезивање и инсталирање нових уређаја
INTBNK: Коришћење Интернет банкарства
ONLCNS: Учествовање у он - лине консултацијама или гласање за дефинисање грађанских или политичких питања
ONLSFT: Коришћење софтвера који се покреће преко Интернета за уређивање текстуалних докумената, табела или презентација
PCPR: Писање рачунарског програма помоћу специјализованог програмског језика
PRVCY: Промјена подешавања приватности на вашем уређају, налогу или апликацији да бисте ограничили дјељење личних података и информација (нпр. име, контакт информације, фотографије)
SCRTY: Подешавање ефикасних безбедносних мјера (нпр. јаке лозинке, обавјештење о покушају пријављивања) за заштиту уређаја и налога на мрежи
SNTWK: Учествовање у друштвеним мрежама
SOFT: Проналажење, преузимање, инсталирање и конфигурисање софтвера
TRAF: Пренос датотека између рачунара и других уређаја
UPLD: Учитавање садржаја који је креирао сам/корисник на веб локацију за дељење
VOIP: Телефонирање преко Интернета / ВоИП
VRFY: Провјера поузданости информација пронађених на мрежи
Type_of_skill: Врста вјештина
