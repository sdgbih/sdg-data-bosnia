Type_of_household: Типови домаћинства
HH_ADTONLY: Домаћинства састављена само од особа старости између 20 и 59 година
HH_ADTWCHLDADO: Одрасли који живе са децом (0 до 9 година) и или адолесцентима (10 до 19 година)
HH_ADTWOLDER: Домаћинства састављена од одраслих који живе са најмање једном старијом особом (60 година и више)
HH_MULTIGEN: Домаћинства укључују одрасле који живе са особама млађим од 20 година (деца и или адолесценти), као и старије одрасле особе (60 година и више)
HH_ONLYOLDER: Домаћинства састављена искључиво од старијих особа (60 година и више)
_T: Све врсте домаћинстава
