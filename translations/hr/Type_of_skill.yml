ARSP: Korištenje osnovnih aritmetičkih formula u proračunskoj tablici
COPA: Korištenje alata za kopiranje i lijepljenje za dupliciranje ili premještanje informacija unutar dokumenta
CMFL: Kopiranje ili premještanje datoteke ili mape
DLDONLD: Čitanje ili preuzimanje on-line novina, časopisa ili elektroničkih knjiga
EMAIL: Slanje e - mailova s ​​priloženim datotekama
EPRS: Izrada elektroničkih prezentacija s prezentacijskim softverom
FONLCRS: Izvođenje formalnog online tečaja
GSINF: Dobivanje informacija o robi ili uslugama na mreži
GSPUR: Kupnja ili naručivanje robe ili usluga putem Interneta
HLTHINF: traženje zdravstvenih informacija (o ozljedama, bolestima, prehrani itd.)
INST: Spajanje i instaliranje novih uređaja
INTBNK: Korištenje Internet bankarstva
ONLCNS: Sudjelovanje u on - line konzultacijama ili glasovanje za definiranje građanskih ili političkih pitanja
ONLSFT: Korištenje softvera pokrenutog preko Interneta za uređivanje tekstualnih dokumenata, proračunskih tablica ili prezentacija
PCPR: Pisanje računalnog programa pomoću specijaliziranog programskog jezika
PRVCY: Promjena postavki privatnosti na vašem uređaju, računu ili aplikaciji kako biste ograničili dijeljenje osobnih podataka i informacija (npr. ime, podaci za kontakt, fotografije)
SCRTY: Postavljanje učinkovitih sigurnosnih mjera (npr. jake lozinke, obavijest o pokušaju prijave) za zaštitu uređaja i mrežnih računa
SNTWK: Sudjelovanje u društvenim mrežama
SOFT: Pronalaženje, preuzimanje, instaliranje i konfiguriranje softvera
TRAF: Prijenos datoteka između računala i drugih uređaja
UPLD: Prijenos sadržaja koji je sam/korisnik stvorio na web mjesto za dijeljenje
VOIP: Telefoniranje preko interneta / VoIP
VRFY: Provjera pouzdanosti informacija pronađenih na internetu
Type_of_skill: Vrsta vještina
