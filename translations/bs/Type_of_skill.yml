ARSP: Korištenje osnovnih aritmetičkih formula u proračunskoj tablici
COPA: Korištenje alata za kopiranje i lijepljenje za dupliranje ili premještanje informacija unutar dokumenta
CMFL: Kopiranje ili premještanje datoteke ili mape
DLDONLD: Čitanje ili preuzimanje on - line novina, časopisa ili elektronskih knjiga
EMAIL: Slanje e - pošte sa priloženim fajlovima
EPRS: Izrada elektronskih prezentacija sa softverom za prezentacije
FONLCRS: Obavljanje formalnog online kursa
GSINF: Dobijanje informacija o robi ili uslugama na mreži
GSPUR: Kupovina ili naručivanje robe ili usluga putem Interneta
HLTHINF: Traženje informacija o zdravlju (o povredama, bolesti, ishrani, itd.)
INST: Povezivanje i instalacija novih uređaja
INTBNK: Korištenje Internet bankarstva
ONLCNS: Učestvovanje u on-line konsultacijama ili glasanje za definisanje građanskih ili političkih pitanja
ONLSFT: Korišćenje softvera pokrenutog preko Interneta za uređivanje tekstualnih dokumenata, tabela ili prezentacija
PCPR: Pisanje kompjuterskog programa pomoću specijalizovanog programskog jezika
PRVCY: Promjena postavki privatnosti na vašem uređaju, računu ili aplikaciji kako biste ograničili dijeljenje ličnih podataka i informacija (npr. ime, kontakt informacije, fotografije)
SCRTY: Postavljanje efikasnih sigurnosnih mjera (npr. jake lozinke, obavještenje o pokušaju prijave) za zaštitu uređaja i online računa
SNTWK: Učestvovanje na društvenim mrežama
SOFT: Pronalaženje, preuzimanje, instaliranje i konfigurisanje softvera
TRAF: Prijenos datoteka između računara i drugih uređaja
UPLD: Učitavanje sadržaja koji je kreirao sam / korisnik na web stranicu za dijeljenje
VOIP: Telefoniranje preko Interneta / VoIP
VRFY: Provjera pouzdanosti informacija pronađenih na mreži
Type_of_skill: Vrsta vještina
